// Unofficial NeoForge 26.3 port of Radiant Gear (LGPL-3.0-or-later).
// Modified 2026-10-13 by DEHunter58711: replaces the upstream multiloader buildscripts.
plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

repositories {
    // Curios API
    maven { url = 'https://maven.theillusivec4.top/' ; content { includeGroup 'top.theillusivec4.curios' } }
    // LambDynamicLights API + Yumi Commons
    maven { url = 'https://maven.gegy.dev/releases/' ; content { includeGroupByRegex 'dev\\.(lambdaurora|yumi).*' } }
    maven { url = 'https://api.modrinth.com/maven' ; content { includeGroup 'maven.modrinth' } }
    mavenCentral()
}

base { archivesName = mod_id }

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" { sourceSet(sourceSets.main) }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

var mappingsAttribute = Attribute.of('net.minecraft.mappings', String)

dependencies {
    attributesSchema { attribute(mappingsAttribute) }

    // Curios: API jar for compilation only (optional at runtime, guarded).
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    // LambDynamicLights v4 API (mojmap); optional, client-only, guarded.
    compileOnly("dev.lambdaurora.lambdynamiclights:lambdynamiclights-api:${ldl_version}") {
        attributes { attribute(mappingsAttribute, 'mojmap') }
    }
    // Dev runtime (runClient self-check) with real Curios + LDL.
    // QA: -PnoCurios starts the dev client without Curios to check the "disabled, no crash" path.
    if (!providers.gradleProperty('noCurios').isPresent()) {
        localRuntime "maven.modrinth:curios:${curios_version}"
    }
    localRuntime "maven.modrinth:lambdynamiclights:${ldl_version}"

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) { useJUnitPlatform() }

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// LGPL: ship the original license files verbatim plus the port notes inside the jar.
var licenseSuffix = "_${mod_id}"
tasks.named('jar', Jar).configure {
    from('LICENSE') { rename { "LICENSE" + licenseSuffix } }
    from('COPYING') { rename { "COPYING" + licenseSuffix } }
    from('COPYING.LESSER') { rename { "COPYING.LESSER" + licenseSuffix } }
    from('PORTING_NOTES.md') { rename { "PORTING_NOTES" + licenseSuffix + ".md" } }
    manifest {
        attributes([
                'Implementation-Title'  : project.mod_name,
                'Implementation-Version': project.mod_version,
                'Implementation-Vendor' : 'Illusive Soulworks / TheIllusiveC4 (original author); DEHunter58711 (unofficial port)',
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}
